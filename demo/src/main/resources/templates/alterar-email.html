<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alterar e-mail - MWK Eventos</title>
    <link rel="stylesheet" href="/estilo.css">
</head>
<body class="pagina-perfil">
    <header>
        <a class="brand" href="/mural">MWK Eventos</a>
        <a href="/perfil">Voltar ao perfil</a>
    </header>
    <main>
        <section class="formulario" aria-labelledby="tituloEmail">
            <p class="eyebrow">Dados da conta</p>
            <h1 id="tituloEmail">Alterar e-mail</h1>
            <p class="intro">E-mail atual: <strong th:text="${usuario.email}">email@example.com</strong></p>
            <p class="alerta erro" th:if="${erroEmail != null}" th:text="${erroEmail}" role="alert"></p>
            <p class="alerta sucesso" th:if="${sucessoEmail != null}" th:text="${sucessoEmail}" role="status"></p>
            <form action="/perfil/email" method="post">
                <div class="campo"><label for="senhaAtual">Senha atual</label><input id="senhaAtual" name="senhaAtual" type="password" autocomplete="current-password" required></div>
                <div class="campo"><label for="novoEmail">Novo e-mail</label><input id="novoEmail" name="novoEmail" type="email" autocomplete="email" required></div>
                <div class="campo"><label for="confirmarEmail">Confirmar novo e-mail</label><input id="confirmarEmail" name="confirmarEmail" type="email" autocomplete="email" required></div>
                <button class="button" type="submit">Salvar novo e-mail</button>
            </form>
        </section>
    </main>
</body>
</html>
