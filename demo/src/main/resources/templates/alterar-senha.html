<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alterar senha - MWK Eventos</title>
    <link rel="stylesheet" href="/estilo.css">
</head>
<body class="pagina-perfil">
    <header>
        <a class="brand" href="/mural">MWK Eventos</a>
        <a href="/perfil">Voltar ao perfil</a>
    </header>
    <main>
        <section class="formulario" aria-labelledby="tituloSenha">
            <p class="eyebrow">Segurança da conta</p>
            <h1 id="tituloSenha">Alterar senha</h1>
            <p class="intro">Confirme sua senha atual para escolher uma nova.</p>
            <p class="alerta erro" th:if="${erroSenha != null}" th:text="${erroSenha}" role="alert"></p>
            <p class="alerta sucesso" th:if="${sucessoSenha != null}" th:text="${sucessoSenha}" role="status"></p>
            <form action="/perfil/senha" method="post">
                <div class="campo"><label for="senhaAtual">Senha atual</label><input id="senhaAtual" name="senhaAtual" type="password" autocomplete="current-password" required></div>
                <div class="campo"><label for="novaSenha">Nova senha</label><input id="novaSenha" name="novaSenha" type="password" autocomplete="new-password" minlength="8" required></div>
                <div class="campo"><label for="confirmarSenha">Confirmar nova senha</label><input id="confirmarSenha" name="confirmarSenha" type="password" autocomplete="new-password" minlength="8" required></div>
                <button class="button" type="submit">Salvar nova senha</button>
            </form>
        </section>
    </main>
</body>
</html>
