<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil - MWK Eventos</title>
    <link rel="stylesheet" href="/estilo.css">
</head>
<body class="pagina-perfil">
    <header>
        <a class="brand" href="/mural">MWK Eventos</a>
        <a href="/mural">Voltar ao mural</a>
    </header>
    <main>
        <section class="perfil-resumo" aria-labelledby="tituloPerfil">
            <span class="profile-icon profile-icon-grande" aria-hidden="true"></span>
            <div>
                <p class="eyebrow">Configurações da conta</p>
                <h1 id="tituloPerfil" th:text="${usuario.nome}">Nome</h1>
                <p class="perfil-email" th:text="${usuario.email}">email@example.com</p>
            </div>
        </section>

        <section class="perfil-sessao perfil-cpf">
            <h2>CPF para ingressos</h2>
            <p>Seu CPF aparecerá no documento do ingresso. Ele é usado para identificação na entrada.</p>
            <p class="erro" th:if="${erroCpf != null}" th:text="${erroCpf}" role="alert"></p>
            <p class="mensagem-sucesso" th:if="${sucessoCpf != null}" th:text="${sucessoCpf}" role="status"></p>
            <form action="/perfil/cpf" method="post">
                <label for="cpf">CPF</label>
                <input id="cpf" name="cpf" type="text" inputmode="numeric" autocomplete="off"
                       maxlength="14" placeholder="000.000.000-00" th:value="${usuario.cpf}" required>
                <button class="button" type="submit">Salvar CPF</button>
            </form>
        </section>

        <nav class="config-opcoes" aria-label="Configurações da conta">
            <a class="config-opcao" href="/perfil/alterar-senha">
                <span>
                    <strong>Alterar senha</strong>
                    <small>Atualize a senha da sua conta</small>
                </span>
                <span class="seta-opcao" aria-hidden="true">›</span>
            </a>
            <a class="config-opcao" href="/perfil/alterar-email">
                <span>
                    <strong>Alterar e-mail</strong>
                    <small th:text="|E-mail atual: ${usuario.email}|">Atualize o e-mail da sua conta</small>
                </span>
                <span class="seta-opcao" aria-hidden="true">›</span>
            </a>
        </nav>

        <section class="perfil-sessao">
            <form action="/sair" method="post" class="perfil-sair">
                <button class="button secondary" type="submit">Sair da conta</button>
            </form>
        </section>
    </main>
    <script>
        const campoCpf = document.getElementById("cpf");
        campoCpf.addEventListener("input", () => {
            const digitos = campoCpf.value.replace(/\D/g, "").slice(0, 11);
            let formatado = digitos.slice(0, 3);
            if (digitos.length > 3) formatado += "." + digitos.slice(3, 6);
            if (digitos.length > 6) formatado += "." + digitos.slice(6, 9);
            if (digitos.length > 9) formatado += "-" + digitos.slice(9, 11);
            campoCpf.value = formatado;
        });
    </script>
</body>
</html>
